packages:
  - .pkgs/*
  - apps/*
  - packages/*
  - plugins/*
  - examples/*

allowBuilds:
  "@nubjs/nub": true
  dprint: true
  esbuild: true
  nx: true
  sharp: true

overrides:
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  # Single-version pin: minimatch 9.x chain (glob 10.5.0, @npmcli/map-workspaces) would otherwise pull brace-expansion 2.x
  brace-expansion: "^5.0.12"
  # Single-version pin: unified-args 11.0.1 declares ^3.0.0 and would otherwise pull chokidar 3.x
  chokidar: "^6.0.0"
  # Single-version pin: tsl and importx would otherwise pull esbuild 0.27.x/0.25.x
  esbuild: "^0.28.2"
  # Transitive dependency via ajv 8.20.0 (declares ^3.0.1), fixes CVE-2026-18446 (GHSA-7p8r-x3mc-p8w7)
  fast-uri: "^4.2.3"
  fumadocs-twoslash: "3.3.1"
  next: "16.4.3"
  postcss: "^8.5.32"
  react-dom: "^19.3.1"
  react: "^19.3.1"
  # Keeps @babel/core's ^6.3.1 range off the 6.x line (no provenance, fails trustPolicy no-downgrade)
  semver: "^7.8.5"
  ts-api-utils: "^2.5.0"
  typescript-eslint: "^8.72.1"
  typescript: "6.0.3"
  # Keep a single vite copy in the tree (fumadocs-mdx's peer otherwise stays on an older resolution)
  vite: "^8.3.5"
  # Single-version pin: nx 23.3.0 pins exact 7.29.0
  undici: "^8.12.3"
  # Single-version pin: nx 23.3.1 pins exact 10.2.5 and the glob 10.5.0 chain declares ^9
  minimatch: "^10.2.6"

trustPolicy: "no-downgrade"
trustPolicyExclude:
  # Required by @types/node 20; the undici-types 6.x line predates provenance publishing (types-only package)
  - undici-types
minimumReleaseAge: 0
patchedDependencies:
  import-integrity-lint: patches/import-integrity-lint.patch
